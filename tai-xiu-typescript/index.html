<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASINO - TÀI XỈU ONLINE</title>
  </head>
  <body>
    <main id="game-stage" aria-label="Tài Xỉu Online">
      <canvas id="game-canvas" width="1250" height="750" aria-label="Bàn chơi Tài Xỉu">
        Trình duyệt của bạn cần hỗ trợ HTML Canvas để hiển thị trò chơi.
      </canvas>
      <input
        id="chat-input"
        type="text"
        aria-label="Tin nhắn chat, nhấn Enter để gửi"
        placeholder="Nhập tin nhắn..."
        maxlength="25"
        autocomplete="off"
      />
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
